name: CI/CD Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Install Maven (Windows)
      shell: powershell
      run: |
        $mvnUrl = "https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.zip"
        Invoke-WebRequest $mvnUrl -OutFile "maven.zip"
        Expand-Archive maven.zip -DestinationPath .
        echo "$PWD\apache-maven-3.9.6\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/hand-son-app:latest  
          ${{ secrets.DOCKERHUB_USERNAME }}/hand-son-app:${{ github.sha }}

    - name: Image digest
      run: echo "Image pushed successfully!"

    - name: Import image to k3d
      run: |
        k3d image import ${{ secrets.DOCKERHUB_USERNAME }}/hand-son-app:${{ github.sha }} -c my-cluster

    - name: Update app.yaml image tag
      run: |
        sed -i "s|hand-son-app:.*|hand-son-app:${GITHUB_SHA}|" app.yaml

    - name: Deploy to k3d
      run: |
        kubectl apply -f app.yaml
        kubectl rollout restart deployment handson-deployment
        kubectl rollout status deployment handson-deployment

    - name: Verify deployment
      run: |
        kubectl get pods
        kubectl get svc
