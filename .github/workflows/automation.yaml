name: CI/CD Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:

    # Pull repo
    - name: Checkout code
      uses: actions/checkout@v4

    # Install Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # -------------------------
    # FIX: INSTALL MAVEN
    # -------------------------
    - name: Install Maven (Windows)
      shell: powershell
      run: |
        $mvnUrl = "https://downloads.apache.org/maven/maven-3/3.9.8/binaries/apache-maven-3.9.8-bin.zip"
        Invoke-WebRequest $mvnUrl -OutFile "maven.zip"
        Expand-Archive maven.zip -DestinationPath .
        echo "$PWD\apache-maven-3.9.8\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # Build application
    - name: Build with Maven
      run: mvn clean package -DskipTests

    # Login to Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Build + push Docker image
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/hand-son-app:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/hand-son-app:${{ github.sha }}

    - name: Image digest
      run: echo "Image pushed successfully!"

    # -------------------------
    # K3D / Kubernetes Deployment
    # -------------------------
    - name: Import image to k3d
      run: k3d image import ${{ secrets.DOCKERHUB_USERNAME }}/hand-son-app:latest -c my-cluster

    - name: Update deployment image
      run: |
        kubectl set image deployment/handson-deployment handson=${{ secrets.DOCKERHUB_USERNAME }}/hand-son-app:latest

    - name: Deploy to k3d
      run: |
        kubectl apply -f app.yaml
        kubectl rollout restart deployment handson-deployment
        kubectl rollout status deployment handson-deployment

    - name: Verify deployment
      run: |
        kubectl get pods
        kubectl get svc
