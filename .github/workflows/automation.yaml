name: CI/CD Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:

    # 1. Checkout source code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Install Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # 3. Install Maven manually (Windows self-hosted runner)
    - name: Install Maven (Windows)
      shell: powershell
      run: |
        $mvnUrl = "https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.zip"
        Invoke-WebRequest $mvnUrl -OutFile "maven.zip"
        Expand-Archive maven.zip -DestinationPath .
        echo "$PWD\apache-maven-3.9.6\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # 4. Build the jar
    - name: Build with Maven
      run: mvn clean package -DskipTests

    # 5. Login to Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 6. Build and push docker image
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/hand-son-app:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/hand-son-app:${{ github.sha }}

    - name: Image digest
      run: echo "Image pushed successfully!"

    # --------------------------
    # K3D / Kubernetes Deployment
    # --------------------------

    # 7. Import image into k3d
    - name: Import image to k3d
      run: k3d image import ${{ secrets.DOCKERHUB_USERNAME }}/hand-son-app:latest -c my-cluster

    # 8. Update the deployment image
    - name: Update deployment image
      run: |
        kubectl set image deployment/handson-deployment handson=${{ secrets.DOCKERHUB_USERNAME }}/hand-son-app:latest

    # 9. Apply manifests & restart deployment
    - name: Deploy to k3d
      run: |
        kubectl apply -f app.yaml
        kubectl rollout restart deployment handson-deployment
        kubectl rollout status deployment handson-deployment

    # 10. Verify deployment
    - name: Verify deployment
      run: |
        kubectl get pods
        kubectl get svc
